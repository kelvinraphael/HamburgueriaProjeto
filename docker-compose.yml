services:
  db:
    image: postgres:16
    container_name: delivery_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - delivery_pgdata:/var/lib/postgresql/data

volumes:
  delivery_pgdata: